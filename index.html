    <!--
      DIRECTION CONTRACT — Drummies public landing page

      THESIS: The page earns trust by being honest about a project that does not
      work yet. It refuses the waitlist-template arrangement (gradient hero, three
      feature cards, logo row) and the fake-certainty schedule that claims a stream
      is live because a clock passed.

      OWN-WORLD: Warm near-black ground (#151312), cream (#F2EDE4), one coral
      (#FF6A4D) that only ever means Drummies, amber reserved for schedule states.
      Anton display at poster scale, Archivo text, Martian Mono for times and
      status only. Bordered flat panels, 14px radii, a running ticker band, a
      full-bleed coral field for the single ask.

      STORY: A beginner understands someone is learning drums by building the tool
      they needed, sees whether a session is on now or when the next one is in
      their own timezone, and either joins the waitlist or follows a platform.

      FIRST VIEWPORT: Oversized three-line origin story at left, punchline in
      coral; the studio status panel at right carrying live/next/quiet states with
      the countdown; primary CTA sits under the headline, ticker band below.

      FORM: User-pinned world (a pinned direction beats the roll). Seed key
      f8bc88d4 dealt "Drummies Departures" at index 5 of the grounded list; that
      round was re-rolled and then closed by the pin. The board's honest-status
      discipline and visible local timezone were carried into this world.

      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, DESIGN.md, and every shipping raster carrying
      its provenance
    -->
